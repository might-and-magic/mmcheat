name: Release

# Publishing a new MMCheat version:
#   1. bump version and version_date in Scripts/Modules/MMCheat/about.lua
#   2. commit, then push a matching tag:  git tag v1.2.3 && git push origin v1.2.3
# This workflow then builds the package and creates the GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release
        required: true

permissions:
  contents: write

env:
  # release that holds the binaries which are not kept in this repository
  BINARIES_TAG: binaries

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Check that the tag matches about.lua
        id: version
        run: |
          version=$(./build.sh --version)
          tag="${{ inputs.tag || github.ref_name }}"
          if [ "$version" != "${tag#v}" ]; then
            echo "::error::about.lua says $version but the tag is $tag"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download the bundled binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$BINARIES_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern iup.dll --pattern vcruntime140.dll --clobber
          mkdir -p ExeMods
          mv iup.dll ExeMods/iup.dll

      - name: Build
        run: ./build.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          gh release create "$tag" dist/MMCheat-*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "MMCheat ${{ steps.version.outputs.version }}" \
            --generate-notes

      - uses: actions/upload-artifact@v4
        with:
          name: MMCheat-${{ steps.version.outputs.version }}
          path: dist/*.zip
